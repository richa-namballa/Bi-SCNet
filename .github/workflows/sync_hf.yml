name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: richa-namballa/Bi-SCNet
          huggingface_repo_id: richa-namballa/Bi-SCNet
          repo_type: model
          hf_token: ${{ secrets.HF_TOKEN }}
